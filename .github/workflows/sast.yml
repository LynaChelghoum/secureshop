name: SAST
permissions:
  security-events: write
  contents: read
on:
  push:
    branches: [ master ]
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit on all Python services
        run: |
          mkdir -p bandit-results
          for service in user-service product-service notification-service; do
            if [ -d "services/$service" ]; then
              bandit -r "services/$service" -f sarif -o "bandit-results/$service.sarif" || true
            fi
          done
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results
          category: bandit