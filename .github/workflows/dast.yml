name: DAST - Nikto

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  nikto-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for API Gateway
        run: |
          until curl -s http://localhost/api/users/health; do sleep 2; done
      - name: Run Nikto scan
        run: |
          docker run --rm -v ${PWD}:/tmp cirt/nikto nikto -h http://localhost -o /tmp/nikto_report.html || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: nikto_report.html