name: DAST Scan with ZAP

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          until curl -s http://localhost/api/users/health; do
            echo "Waiting for gateway..."
            sleep 3
          done

      - name: Get Gateway container IP
        run: |
          GATEWAY_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker ps -q --filter "name=gateway"))
          echo "GATEWAY_IP=$GATEWAY_IP" >> $GITHUB_ENV
          echo "Gateway IP: $GATEWAY_IP"

      - name: Test connectivity from ZAP container
        run: |
          docker run --rm curlimages/curl curl -s http://${GATEWAY_IP}/api/users/health || echo "FAILED to connect"

      - name: Run ZAP Baseline Scan
        env:
          GATEWAY_IP: ${{ env.GATEWAY_IP }}
        run: |
          docker run --rm -v $(pwd):/zap/wrk \
            -t zaproxy/zap-stable \
            zap-baseline.py -t http://${GATEWAY_IP} -r baseline_report.html \
            || echo "ZAP scan failed but continuing"

      - name: Upload Report (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: baseline_report.html
