name: DAST - OWASP ZAP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          echo "Waiting for services..."
          until curl -s http://localhost:80/api/users/health; do sleep 2; done

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://host.docker.internal:80'
          cmd_options: '-a -m 2'   # -a : attendre le démarrage, -m 2 : timeouts courts

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap_report
          path: report.html