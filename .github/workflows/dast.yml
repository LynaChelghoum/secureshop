name: DAST Scan with ZAP

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API Gateway to be ready
        run: |
          until curl -s http://localhost/api/users/health; do
            echo "Waiting for the gateway..."
            sleep 3
          done

      - name: Get Gateway Container IP
        id: get-ip
        run: |
          GATEWAY_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker ps -q --filter "name=gateway"))
          echo "GATEWAY_IP=$GATEWAY_IP" >> $GITHUB_ENV
          echo "Gateway IP is: $GATEWAY_IP"

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk -t zaproxy/zap-stable zap-baseline.py -t http://${{ env.GATEWAY_IP }} -r baseline_report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: baseline_report.html