name: DAST Scan with Nikto

on:
  workflow_dispatch:

jobs:
  nikto-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          until curl -s http://localhost/api/users/health; do
            echo "Waiting for gateway..."
            sleep 3
          done

      - name: Run Nikto scan
        run: |
          docker run --rm -v $(pwd):/tmp \
            --network container:$(docker ps -q --filter "name=gateway") \
            -t sullo/nikto \
            nikto -h http://localhost -o /tmp/nikto_report.html

      - name: Upload Nikto report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nikto-report
          path: nikto_report.html
