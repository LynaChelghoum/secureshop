name: DAST Scan with ZAP

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          until curl -s http://localhost/api/users/health; do
            echo "Waiting for gateway..."
            sleep 3
          done

      - name: Get Gateway container ID
        id: get-id
        run: |
          GATEWAY_ID=$(docker ps -q --filter "name=gateway")
          echo "GATEWAY_ID=$GATEWAY_ID" >> $GITHUB_ENV
          echo "Gateway container ID: $GATEWAY_ID"

      - name: Run ZAP Baseline Scan (same network as gateway)
        run: |
          docker run --rm \
            --network container:${{ env.GATEWAY_ID }} \
            -v $(pwd):/zap/wrk \
            -t zaproxy/zap-stable \
            zap-baseline.py -t http://localhost -r baseline_report.html

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: baseline_report.html
